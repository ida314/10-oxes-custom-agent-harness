[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-agent"
version = "0.1.0"
description = "Career intelligence harness system with Meta-Harness optimizer"
requires-python = ">=3.12"
dependencies = [
    "sqlmodel>=0.0.21",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
browser = [
    "playwright>=1.44",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app", "harnesses", "skills", "evals", "db", "optimizers"]
